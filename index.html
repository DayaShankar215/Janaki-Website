<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── SEO ─────────────────────────────────────────────────── -->
    <title>Janaki Technical Training Center Pvt. Ltd. | Technical &amp; Vocational Training</title>
    <meta
      name="description"
      content="Janaki Technical Training Center Pvt. Ltd. offers practical, career-oriented technical and vocational training — electrician, plumbing, welding, construction, computer skills and more. Learn by doing."
    />
    <meta name="theme-color" content="#0A1730" />
    <link rel="canonical" href="https://janakitechnical.com.np/" />

    <!-- ── Open Graph / social sharing ─────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Janaki Technical Training Center Pvt. Ltd." />
    <meta property="og:url" content="https://janakitechnical.com.np/" />
    <meta property="og:title" content="Janaki Technical Training Center Pvt. Ltd. | Technical &amp; Vocational Training" />
    <meta
      property="og:description"
      content="Practical technical and vocational training designed to equip learners with industry-relevant, hands-on skills."
    />
    <meta property="og:image" content="https://janakitechnical.com.np/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Janaki Technical Training Center Pvt. Ltd." />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- ── Icons ──────────────────────────────────────────────── -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    

    <!-- ── Fonts ───────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" />
    <!-- Loaded without blocking the first paint: the browser starts rendering
         with the fallback stack and swaps in Inter/Jakarta when the CSS lands. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'; this.onload=null;"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Apply saved theme before paint to avoid a flash of the wrong theme -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('jttc-theme');
          if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
